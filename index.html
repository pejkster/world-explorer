<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Explorer">
<meta name="theme-color" content="#1B2A3B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>World Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── Palette ── */
:root {
  --ink:    #1B2A3B;
  --bot:    #2D6A4F;
  --carto:  #1A3A5C;
  --spec:   #F5EFE0;
  --amber:  #D4874A;
  --red:    #C0392B;
  --ink85:  rgba(27,42,59,0.85);
}

/* ── Reset ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--ink);
  font-family: 'Baloo 2', sans-serif;
  touch-action: none;
}

/* ── Game wrapper + responsive canvas ── */
#wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
}
canvas {
  display: block;
  /* Scale to fill screen, maintain 3:2 ratio */
  width:  min(100vw, 150vh);
  height: min(100vh, 66.67vw);
  border: none;
  outline: none;
  touch-action: none;
}

/* ── Portrait rotation warning ── */
#rotate-msg {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--ink);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 40px;
}
@media (orientation: portrait) {
  #rotate-msg { display: flex; }
}
.rotate-icon { font-size: 64px; animation: rotateHint 2s ease-in-out infinite; }
@keyframes rotateHint {
  0%, 100% { transform: rotate(0deg); }
  40%       { transform: rotate(90deg); }
  60%       { transform: rotate(90deg); }
}
.rotate-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--spec);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.rotate-sub {
  font-family: 'Baloo 2', sans-serif;
  font-size: 18px;
  color: rgba(245,239,224,0.55);
}

/* ── Overlay base ── */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 20;
}
.overlay.active { pointer-events: all; }
.hidden { display: none !important; }

/* ── Buttons ── */
.btn-primary {
  background: var(--bot);
  color: var(--spec);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 600;
  font-size: 18px;
  border: none;
  border-radius: 6px;
  padding: 14px 28px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:hover, .btn-primary:active { background: #245840; }

.btn-secondary {
  background: transparent;
  color: var(--ink);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 600;
  font-size: 18px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 12px 26px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary:hover, .btn-secondary:active { background: var(--spec); }

/* ── Character Select ── */
#char-select {
  background: var(--carto);
  flex-direction: column;
}
.cs-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 36px 48px;
  width: 100%;
}
.cs-logo {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: clamp(32px, 5vw, 52px);
  color: var(--spec);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1;
}
.cs-sub {
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: -16px;
}
.cs-rule { width: 100%; height: 1px; background: rgba(245,239,224,0.2); }
.cs-prompt {
  font-size: 13px;
  font-weight: 600;
  color: rgba(245,239,224,0.5);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.cs-cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.cs-card {
  background-color: var(--spec);
  background-image: radial-gradient(circle, rgba(27,42,59,0.1) 1px, transparent 1px);
  background-size: 12px 12px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 24px 28px;
  cursor: pointer;
  box-shadow: 4px 6px 0 rgba(27,42,59,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 160px;
  -webkit-tap-highlight-color: transparent;
}
.cs-card.selected { border-color: var(--amber); box-shadow: 4px 6px 0 var(--amber); }
.cs-avatar {
  width: 68px; height: 68px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
}
.cs-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.cs-age {
  font-size: 13px;
  font-weight: 600;
  color: rgba(27,42,59,0.5);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ── Specimen Card ── */
#spec-overlay { background: rgba(27,42,59,0.75); }
.spec-card {
  background-color: var(--spec);
  background-image: radial-gradient(circle, rgba(27,42,59,0.1) 1px, transparent 1px);
  background-size: 12px 12px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  box-shadow: 4px 6px 0 rgba(27,42,59,0.25);
  width: min(400px, 92vw);
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  animation: cardReveal 200ms ease-out both;
}
@keyframes cardReveal {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .spec-card, .postcard-wrap { animation: none; }
}
.spec-illustration { font-size: 88px; line-height: 1; margin-bottom: 16px; }
.spec-photo {
  width: 128px; height: 128px;
  object-fit: cover;
  border: 2px solid var(--ink);
  border-radius: 4px;
  box-shadow: 3px 3px 0 rgba(27,42,59,0.25);
  margin-bottom: 16px;
}
.spec-rule { width:100%; height:1.5px; background:var(--ink); margin: 10px 0; }
.spec-name-row { width:100%; display:flex; align-items:center; justify-content:space-between; }
.spec-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.spec-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.spec-dot.common { background: var(--bot); }
.spec-dot.rare   { background: var(--red); }
.spec-latin {
  font-size: 15px;
  font-weight: 400;
  font-style: italic;
  color: rgba(27,42,59,0.5);
}
.spec-fact {
  font-size: 18px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.6;
  margin: 8px 0 18px;
}
.spec-power-badge {
  width: 100%;
  background: var(--bot);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  box-shadow: 2px 2px 0 var(--ink);
}
.spec-power-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.spec-power-name {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  color: var(--spec);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.spec-power-desc { font-size: 14px; color: rgba(245,239,224,0.75); line-height: 1.4; }

/* ── Journal ── */
#journal-overlay { background: rgba(27,42,59,0.88); flex-direction: column; }
.journal-panel {
  background-color: var(--spec);
  background-image: radial-gradient(circle, rgba(27,42,59,0.08) 1px, transparent 1px);
  background-size: 12px 12px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  box-shadow: 4px 6px 0 rgba(27,42,59,0.25);
  width: min(820px, 96vw);
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.journal-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
}
.journal-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: var(--ink);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.journal-count { font-size: 13px; font-weight: 600; color: rgba(27,42,59,0.45); letter-spacing: 0.1em; text-transform: uppercase; }
.journal-close-x {
  background: transparent; border: 2px solid var(--ink); color: var(--ink);
  width: 36px; height: 36px; border-radius: 6px; font-size: 18px; font-weight: 600;
  cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.journal-close-x:hover { background: var(--ink); color: var(--spec); }
.j-section-label { font-size: 13px; font-weight: 600; color: rgba(27,42,59,0.45); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.journal-powers { display:flex; gap:10px; flex-wrap:wrap; }
.j-power-chip {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--bot);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 8px 12px;
  box-shadow: 2px 2px 0 var(--ink);
}
.j-power-chip.locked { background: transparent; border-style: dashed; opacity: 0.4; }
.j-power-chip span:first-child { font-size: 18px; }
.j-power-text { font-size: 13px; font-weight: 600; color: var(--spec); }
.j-power-chip.locked .j-power-text { color: var(--ink); }
.j-power-desc { font-size: 12px; color: rgba(245,239,224,0.65); line-height: 1.3; margin-top: 2px; }
.journal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}
.journal-item {
  background: var(--spec);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 12px 8px;
  box-shadow: 2px 3px 0 rgba(27,42,59,0.18);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.journal-item.locked { opacity: 0.35; border-style: dashed; }
.j-item-emoji { font-size: 34px; line-height: 1; }
.j-item-name { font-size: 12px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.2; }
.j-item-country { font-size: 11px; color: rgba(27,42,59,0.45); text-align: center; }

/* ── Postcard ── */
#postcard-overlay { background: rgba(27,42,59,0.88); flex-direction: column; justify-content: flex-start; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.postcard-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  animation: pcSlide 300ms ease-out both;
  width: min(720px, 96vw);
}
@keyframes pcSlide {
  from { opacity:0; transform: translateX(40px); }
  to   { opacity:1; transform: translateX(0); }
}
.postcard {
  background: var(--spec);
  border: 2px solid var(--ink);
  border-radius: 4px;
  box-shadow: 4px 6px 0 rgba(27,42,59,0.3);
  display: grid;
  grid-template-columns: 1fr 200px;
  width: 100%;
}
@media (max-width: 600px) {
  .postcard { grid-template-columns: 1fr; }
  .pc-right { border-left: none !important; border-top: 2px dashed rgba(27,42,59,0.3); }
}
.pc-left { padding: 28px 24px; border-right: 2px dashed rgba(27,42,59,0.3); display:flex; flex-direction:column; gap:12px; }
.pc-label { font-size: 13px; font-weight: 600; color: rgba(27,42,59,0.45); letter-spacing: 0.12em; text-transform: uppercase; }
.pc-country { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; }
.pc-rule { height: 1.5px; background: var(--ink); }
.pc-message { font-size: 18px; font-weight: 400; font-style: italic; color: var(--ink); line-height: 1.6; }
.pc-right {
  padding: 24px 18px;
  background-image: radial-gradient(circle, rgba(27,42,59,0.08) 1px, transparent 1px);
  background-size: 12px 12px;
  background-color: var(--spec);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.pc-stamp {
  width: 90px; height: 90px;
  border: 2px solid var(--red); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  box-shadow: 2px 2px 0 var(--red);
}
.pc-stamp-label { font-size: 11px; font-weight: 600; color: var(--red); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
.pc-divider { height: 1px; background: rgba(27,42,59,0.2); width: 100%; }
.pc-to-label { font-size: 12px; font-weight: 600; color: rgba(27,42,59,0.4); letter-spacing: 0.08em; text-transform: uppercase; align-self: flex-start; }
.pc-to-names { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--ink); align-self: flex-start; line-height: 1.6; }
.pc-collected { font-size: 13px; font-weight: 600; color: rgba(27,42,59,0.5); text-align: center; margin-top: auto; }
.pc-btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.postcard-wrap { position: relative; }
.pc-close-x {
  position: absolute; top: -14px; right: -14px; z-index: 2;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--red); color: var(--spec); border: 2px solid var(--spec);
  font-size: 20px; font-weight: 600; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 0 rgba(27,42,59,0.4); -webkit-tap-highlight-color: transparent;
}
.pc-close-x:hover { background: #a93226; }
</style>
</head>
<body>

<!-- ── Portrait warning ── -->
<div id="rotate-msg">
  <div class="rotate-icon">📱</div>
  <div class="rotate-title">Rotate Your Device</div>
  <div class="rotate-sub">World Explorer is best in landscape mode</div>
</div>

<div id="wrap">
  <canvas id="canvas" width="900" height="600"></canvas>

  <!-- ── Character Select ── -->
  <div class="overlay active" id="char-select">
    <div class="cs-inner">
      <div>
        <div class="cs-logo">World Explorer</div>
        <div class="cs-sub">A Living Expedition</div>
      </div>
      <div class="cs-rule"></div>
      <div class="cs-prompt">Choose your explorer</div>
      <div class="cs-cards" id="cs-cards"></div>
      <button class="btn-primary" id="btn-start" disabled onclick="startGame()">Begin Expedition</button>
    </div>
  </div>

  <!-- ── Specimen Card ── -->
  <div class="overlay hidden" id="spec-overlay">
    <div class="spec-card">
      <img class="spec-photo hidden" id="spec-photo" alt="">
      <div class="spec-illustration" id="spec-emoji"></div>
      <div class="spec-rule"></div>
      <div class="spec-name-row">
        <span class="spec-name" id="spec-name"></span>
        <span class="spec-dot" id="spec-dot"></span>
      </div>
      <div class="spec-name-row" style="margin-top:4px">
        <span class="spec-latin" id="spec-latin"></span>
      </div>
      <div class="spec-rule"></div>
      <p class="spec-fact" id="spec-fact"></p>
      <div class="spec-power-badge hidden" id="spec-power">
        <div>
          <div class="spec-power-label">⚡ Power Unlocked</div>
          <div class="spec-power-name" id="spec-power-name"></div>
          <div class="spec-power-desc" id="spec-power-desc"></div>
        </div>
      </div>
      <button class="btn-primary" onclick="dismissCard()" style="width:100%">Nice! ✓</button>
    </div>
  </div>

  <!-- ── Journal ── -->
  <div class="overlay hidden" id="journal-overlay">
    <div class="journal-panel">
      <div class="journal-header">
        <span class="journal-title">Field Journal</span>
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="journal-count" id="journal-count"></span>
          <button class="journal-close-x" onclick="closeJournal()" aria-label="Close">✕</button>
        </div>
      </div>
      <div>
        <div class="j-section-label">Powers</div>
        <div class="journal-powers" id="journal-powers"></div>
      </div>
      <div>
        <div class="j-section-label">Specimens</div>
        <div class="journal-grid" id="journal-grid"></div>
      </div>
      <button class="btn-secondary" onclick="closeJournal()" style="align-self:center">Close Journal</button>
    </div>
  </div>

  <!-- ── Postcard ── -->
  <div class="overlay hidden" id="postcard-overlay">
    <div class="postcard-wrap">
      <button class="pc-close-x" onclick="backToMap()" aria-label="Back to map">✕</button>
      <div class="postcard">
        <div class="pc-left">
          <div class="pc-label">Greetings from</div>
          <div class="pc-country" id="pc-country"></div>
          <div class="pc-rule"></div>
          <div class="pc-message" id="pc-message"></div>
        </div>
        <div class="pc-right">
          <div class="pc-stamp" id="pc-stamp"></div>
          <div class="pc-stamp-label">World<br>Explorer</div>
          <div class="pc-divider"></div>
          <div class="pc-to-label">To:</div>
          <div class="pc-to-names" id="pc-to"></div>
          <div class="pc-divider"></div>
          <div class="pc-collected" id="pc-collected"></div>
        </div>
      </div>
      <div class="pc-btn-row">
        <button class="btn-primary" onclick="openJournal()">Open Journal</button>
        <button class="btn-secondary" onclick="backToMap()">← Back to Map</button>
      </div>
    </div>
  </div>
</div><!-- #wrap -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/levels.js"></script>
<script src="data/characters.js"></script>
<script src="data/supabase-config.js"></script>
<script src="data/loader.js"></script>
<script>
'use strict';
let LEVELS = window.STATIC_LEVELS || [];

// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const C = {
  ink:   '#1B2A3B',  bot:   '#2D6A4F',
  carto: '#1A3A5C',  spec:  '#F5EFE0',
  amber: '#D4874A',  red:   '#C0392B',
  ink85: 'rgba(27,42,59,0.85)',
};

const W = 900, H = 600;
const GROUND_Y = H - 88;
let   LEVEL_W  = 2100;   // per-level, set on enter
const GRAVITY  = 0.52;

// NOTE: level ENVIRONMENTS may expand beyond the 6 brand colors (per-country
// signature hue, like Ori's zones). UI (specimen cards, postcard, HUD) stays
// strictly on the 6 brand colors.
const THEMES = {
  forest:  {  // Slovenia — cool mossy forest at dusk, firefly gold
    skyTop:'#13314f', skyBot:'#1f4a5e', horizon:'#3f7a52',
    groundTop:'#1c4230', groundBot:'#0f2419',
    platFill:'#D4874A', platEdge:'#1B2A3B', grassLine:'#3f8a52',
    far:'#1c4a55', mid:'#1d4a34', near:'#163826', fore:'#0c1f15',
    fog:'#2a5a4a', particle:'#F4C842', particleKind:'firefly', landmark:'mountain',
    tint:'rgba(120,180,90,0.06)', life:'bear',
  },
  coastal: {  // Japan — soft sakura-silver dusk, drifting petals
    skyTop:'#2a3a5e', skyBot:'#6a5a7e', horizon:'#c98fa6',
    groundTop:'#2a2838', groundBot:'#141022',
    platFill:'#D4874A', platEdge:'#1B2A3B', grassLine:'#c98fa6',
    far:'#4a4a6e', mid:'#3a3450', near:'#2c2640', fore:'#16101f',
    fog:'#8a6a8e', particle:'#F5EFE0', particleKind:'petal', landmark:'fuji',
    tint:'rgba(201,160,176,0.07)', life:'bird',
  },
  tropical:{  // warm gold-amber temple light
    skyTop:'#3a4a6e', skyBot:'#7a6a4a', horizon:'#c4892a',
    groundTop:'#2a5536', groundBot:'#143020',
    platFill:'#1B2A3B', platEdge:'#D4874A', grassLine:'#D4874A',
    far:'#5a6a4e', mid:'#3a5a3e', near:'#2a4a30', fore:'#13281a',
    fog:'#a4823a', particle:'#FF8C42', particleKind:'dust', landmark:'volcano',
    tint:'rgba(196,137,42,0.07)', life:'bird',
  },
};

// ═══════════════════════════════════════════════════════
//  JOURNEY LAYOUTS — a country can define a hand-crafted journey
//  (continuous ground with gaps, scene-based platforms, collectible
//   anchor positions by id, story-marker captions, dark/cave ranges).
//  Levels without a layout fall back to the generic builder.
// ═══════════════════════════════════════════════════════
const GY = GROUND_Y;

function loadSave() {
  try { return JSON.parse(localStorage.getItem('worldExplorer') || '{}'); }
  catch { return {}; }
}
function writeSave(d) { localStorage.setItem('worldExplorer', JSON.stringify(d)); }

function getCharSave(cid) {
  const s = loadSave();
  if (!s[cid]) s[cid] = { collected:{}, powers:[] };
  return s[cid];
}
function markCollected(cid, lid, iid) {
  const s = loadSave();
  if (!s[cid]) s[cid] = { collected:{}, powers:[] };
  if (!s[cid].collected[lid]) s[cid].collected[lid] = [];
  if (!s[cid].collected[lid].includes(iid)) s[cid].collected[lid].push(iid);
  writeSave(s);
}
function isCollected(cid, lid, iid) {
  return (getCharSave(cid).collected[lid] || []).includes(iid);
}
function unlockPower(cid, pid) {
  const s = loadSave();
  if (!s[cid]) s[cid] = { collected:{}, powers:[] };
  if (!s[cid].powers.includes(pid)) s[cid].powers.push(pid);
  writeSave(s);
}
function getPowers(cid) { return getCharSave(cid).powers || []; }

function allPowerDefs() {
  const seen = {};
  LEVELS.forEach(l => l.collectibles.forEach(c => {
    if (c.power && !seen[c.power])
      seen[c.power] = { id:c.power, name:c.powerName, desc:c.powerDesc, emoji:c.powerEmoji };
  }));
  return Object.values(seen);
}

function buildCharSelect() {
  const wrap = document.getElementById('cs-cards');
  wrap.innerHTML = '';
  CHARACTERS.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cs-card';
    div.innerHTML = `
      <div class="cs-avatar" style="background:${c.bodyColor}22">
        <span style="font-size:34px">${i===0?'👦':'🧒'}</span>
      </div>
      <div class="cs-name" style="color:${c.bodyColor}">${c.name}</div>
      <div class="cs-age">Age ${c.age}</div>
    `;
    div.onclick = () => {
      document.querySelectorAll('.cs-card').forEach(el => { el.classList.remove('selected'); });
      div.classList.add('selected');
      charIdx = i;
      document.getElementById('btn-start').disabled = false;
    };
    wrap.appendChild(div);
  });
}

function startGame() {
  if (charIdx === null) return;
  loadCharArt(CHARACTERS[charIdx].id);
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  hide('char-select');
  appState = 'map';
  loop();
}

function drawMap() {
  mapPulse += 1/60;
  ctx.clearRect(0,0,W,H);

  // Cartographic base
  ctx.fillStyle = C.carto;
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle = 'rgba(245,239,224,0.06)';
  ctx.lineWidth = 1;
  for (let x=0; x<W; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Latitude arcs
  ctx.strokeStyle = 'rgba(245,239,224,0.04)';
  for (let i=1; i<5; i++) {
    ctx.beginPath(); ctx.ellipse(W/2,H*0.5, W*0.15*i, H*0.13*i, 0,0,Math.PI*2); ctx.stroke();
  }

  drawMapContinents();

  // Country pins
  LEVELS.forEach((lvl, i) => {
    const px = lvl.mapPosition.x/100*W, py = lvl.mapPosition.y/100*H;
    const hover = mapHover===i;
    const char = CHARACTERS[charIdx];
    const items = lvl.collectibles.filter(c => c.forAge==='both' || c.forAge===String(char.age));

    if (lvl.unlocked) {
      // Amber candlelight pulse — 3s loop
      const pulse = 0.12 + 0.06*Math.sin(mapPulse*(Math.PI*2/3)+i);
      ctx.beginPath(); ctx.arc(px,py,30,0,Math.PI*2);
      ctx.fillStyle = `rgba(212,135,74,${hover?pulse*2.5:pulse})`;
      ctx.fill();
    }

    ctx.beginPath(); ctx.arc(px,py,17,0,Math.PI*2);
    ctx.fillStyle = lvl.unlocked ? C.spec : C.ink; ctx.fill();
    ctx.strokeStyle = lvl.unlocked ? C.amber : 'rgba(245,239,224,0.2)';
    ctx.lineWidth = 2; ctx.stroke();

    ctx.font = '15px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lvl.unlocked ? lvl.emoji : '🔒', px, py);

    ctx.font = `700 ${hover?13:11}px 'Playfair Display',serif`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = lvl.unlocked ? C.spec : 'rgba(245,239,224,0.3)';
    ctx.shadowColor = C.ink; ctx.shadowBlur = 4;
    ctx.fillText(lvl.name.toUpperCase(), px, py+23);
    ctx.shadowBlur = 0;

    // Progress dots
    if (lvl.unlocked) {
      const dotTotalW = items.length*12 - 4;
      items.forEach((it,j) => {
        ctx.beginPath(); ctx.arc(px - dotTotalW/2 + j*12, py+38, 3.5, 0, Math.PI*2);
        ctx.fillStyle = isCollected(char.id,lvl.id,it.id) ? C.amber : 'rgba(245,239,224,0.2)';
        ctx.fill();
      });
    }
  });

  drawCompassRose(W-70, 70, 46);

  // Header
  ctx.font = "700 26px 'Playfair Display',serif";
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.spec;
  ctx.fillText('WORLD EXPLORER', 18, 16);
  ctx.font = "600 12px 'Baloo 2',sans-serif";
  ctx.fillStyle = C.amber;
  ctx.fillText('A LIVING EXPEDITION', 18, 46);

  // Bottom info bar
  const char = CHARACTERS[charIdx];
  ctx.fillStyle = C.ink85;
  ctx.fillRect(0, H-36, W, 36);
  ctx.font = "600 13px 'Baloo 2',sans-serif";
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.amber;
  ctx.fillText(`Explorer: ${char.name}`, 14, H-18);
  let tot=0, pos=0;
  const ageF = String(char.age);
  LEVELS.forEach(l => {
    const its = l.collectibles.filter(c=>c.forAge==='both'||c.forAge===ageF);
    pos += its.length;
    tot += its.filter(c=>isCollected(char.id,l.id,c.id)).length;
  });
  ctx.textAlign = 'center'; ctx.fillStyle = C.spec;
  ctx.fillText(`${tot} / ${pos} specimens`, W/2, H-18);
  ctx.textAlign = 'right'; ctx.fillStyle = C.amber;
  ctx.fillText(`Powers: ${getPowers(char.id).length}`, W-14, H-18);

  // Journal tap zone (drawn on canvas so touch works)
  ctx.fillStyle = C.ink85;
  roundRect(ctx, ZONES.journal.x, ZONES.journal.y, ZONES.journal.w, ZONES.journal.h, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,239,224,0.25)'; ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = "600 13px 'Baloo 2',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.spec;
  ctx.fillText('📖  Journal', ZONES.journal.x + ZONES.journal.w/2, ZONES.journal.y + ZONES.journal.h/2);
  drawMuteBtn();
}

function drawCompassRose(cx,cy,r) {
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(245,239,224,0.18)'; ctx.lineWidth=1; ctx.stroke();
  [[0,-r],[0,r],[-r,0],[r,0]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dx,dy);
    ctx.strokeStyle='rgba(245,239,224,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
  });
  ctx.fillStyle=C.spec; ctx.globalAlpha=0.7;
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(-6,-r+18); ctx.lineTo(6,-r+18); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=0.3;
  [[0,r,-4,r-12,4,r-12],[-r,0,-r+12,-4,-r+12,4],[r,0,r-12,-4,r-12,4]].forEach(([x,y,x2,y2,x3,y3])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha=0.7; ctx.fillStyle=C.spec;
  ctx.font="600 11px 'Baloo 2',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('N',0,-r-5);
  ctx.globalAlpha=1; ctx.restore();
}

function mapClick(mx,my) {
  if (inZone(mx,my,ZONES.mute)) { toggleMute(); return; }
  if (inZone(mx,my,ZONES.journal)) { openJournal(); return; }
  if (appState!=='map') return;
  LEVELS.forEach(lvl => {
    if (!lvl.unlocked) return;
    const px=lvl.mapPosition.x/100*W, py=lvl.mapPosition.y/100*H;
    if (Math.hypot(mx-px,my-py)<24) enterLevel(lvl);
  });
}
function mapMove(mx,my) {
  if (appState!=='map') return;
  mapHover = null;
  LEVELS.forEach((lvl,i)=>{
    if (!lvl.unlocked) return;
    const px=lvl.mapPosition.x/100*W, py=lvl.mapPosition.y/100*H;
    if (Math.hypot(mx-px,my-py)<28) { mapHover=i; canvas.style.cursor='pointer'; }
  });
  if (mapHover===null) canvas.style.cursor='default';
}

function enterLevel(lvl) {
  activeLvl=lvl; appState='level'; levelTime=0; camX=0; hudPulse=1;
  levelSeed = Array.from(lvl.id).reduce((a,c)=>a+c.charCodeAt(0),0) % 997 + 1;
  currentArt = loadLevelArt(lvl.id);
  player.x=80; player.y=GROUND_Y-player.h;
  player.vx=player.vy=0; player.onGround=false; player.facing=1;
  player.extraJumps=0; player.dashCooldown=0; player.dashTimer=0;
  player.coyote=0; player.jumpBuf=0; player.jumping=false;

  const char=CHARACTERS[charIdx];
  const powers=getPowers(char.id);
  if (powers.includes('double_jump')) player.extraJumps=1;

  const layout = getLayout(lvl.id);
  LEVEL_W     = layout ? layout.width : 2100;
  activeStory = layout ? layout.story : [];
  activeDark  = layout ? (layout.dark || []) : [];

  const ageF=String(char.age);
  collectibles = lvl.collectibles
    .filter(c=>c.forAge==='both'||c.forAge===ageF)
    .map(c=>{
      const pos = layout && (layout.collPos[c.id] || layout.collPos[c.name]);
      return { ...c,
        x:      pos ? pos.x : c.x,
        worldY: pos ? pos.y : c.y,
        bobOffset: Math.random()*Math.PI*2, collectedNow:false };
    });

  platforms  = layout ? buildLayoutPlatforms(layout) : buildPlatforms();
  postcardX  = LEVEL_W-120;
  player.safeX = player.x; player.safeY = player.y;

  // Atmosphere particles spread across the whole level
  particles = [];
  const pCount = Math.min(180, Math.round(LEVEL_W/45));
  for (let i=0;i<pCount;i++) {
    particles.push({
      x: Math.random()*LEVEL_W,
      y: Math.random()*(H-120)+20,
      r: 1.2 + Math.random()*2,
      phase: Math.random()*Math.PI*2,
      drift: 0.2 + Math.random()*0.4,
      sway: 6 + Math.random()*14,
    });
  }
  startAmbient(lvl.theme);
}

// Build platforms from a hand-crafted journey layout
function buildLayoutPlatforms(L) {
  const arr = [];
  L.groundSegs.forEach(s => arr.push({ x:s.x, y:GROUND_Y, w:s.w, h:92, isGround:true }));
  const kinds = ['log','rock','plank']; let ki = 0;
  L.plats.forEach(p => arr.push({ x:p[0], y:p[1], w:p[2]||150, h:14, isGround:false, art:kinds[ki++ % 3] }));
  return arr;
}

function buildPlatforms() {
  // 3-ACT layout: Arrival (flat, safe) → Explore (branch) → Vista (climb)
  // Low road is always reachable on/near the ground (6yr path).
  // High road (stepping up) holds rare specimens (11yr path). They rejoin.
  const g = { x:0, y:GROUND_Y, w:LEVEL_W, h:92, isGround:true };
  const kinds = ['log','rock','plank'];
  let ki = 0;
  const P = (x,y,w)=>({ x, y, w, h:14, isGround:false, art: kinds[ki++ % 3] });
  const Y = GROUND_Y;
  // Uniform width (150) so the 3:1 platform art always renders the same thickness
  const Wd = 150;
  return [g,
    // ── ACT 1 · ARRIVAL (0–650) — gentle, low, teach ──
    P(230, Y-100, Wd),
    P(440, Y-130, Wd),

    // ── ACT 2 · EXPLORE (650–1450) — path forks ──
    // low road (easy, both)
    P(660, Y-95,  Wd),
    P(900, Y-110, Wd),
    P(1150,Y-95,  Wd),
    // high road (harder, rare) — a rising staircase
    P(720, Y-180, Wd),
    P(880, Y-235, Wd),
    P(1040,Y-285, Wd),
    P(1230,Y-250, Wd),

    // ── ACT 3 · VISTA (1450–2100) — climb to the view + postcard ──
    P(1420, Y-130, Wd),
    P(1600, Y-190, Wd),
    P(1760, Y-250, Wd),  // the high vista ledge (rare specimen / best view)
    P(1560, Y-95,  Wd),  // low alternative so 6yr still reaches the end
    P(1900, Y-120, Wd),
    P(2030, Y-90,  Wd),
  ];
}

// ═══════════════════════════════════════════════════════
//  LEVEL PHYSICS
// ═══════════════════════════════════════════════════════
function updateLevel() {
  if (appState!=='level') return;
  levelTime += 1/60;

  const char  = CHARACTERS[charIdx];
  const speed = char.speed;
  const jumpH = char.jumpHeight;
  const powers= getPowers(char.id);

  const goL = keys['ArrowLeft']  || keys['a'] || touch.left;
  const goR = keys['ArrowRight'] || keys['d'] || touch.right;
  const goJ = keys['ArrowUp'] || keys[' '] || keys['w'] || touch.jump;
  const goD = keys['Shift'] || keys['z'] || keys['Z'] || touch.dash;

  // ── Horizontal: acceleration + friction (momentum feels alive) ──
  const dir = (goR?1:0) - (goL?1:0);
  if (player.dashTimer > 0) {
    // Locked dash velocity
    player.vx = player.facing * speed * FEEL.DASH_MULT;
    player.dashTimer--;
  } else {
    const accel = player.onGround ? FEEL.ACCEL : FEEL.AIR_ACCEL;
    if (dir !== 0) {
      player.vx += dir * accel;
      player.vx = Math.max(-speed, Math.min(speed, player.vx));
      player.facing = dir;
    } else {
      player.vx *= player.onGround ? FEEL.FRICTION : FEEL.AIR_DRAG;
      if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }
  }

  // ── Dash trigger (timed burst, not 1-frame) ──
  if (powers.includes('dash') && goD && dashWasUp && player.dashCooldown<=0) {
    player.dashTimer = FEEL.DASH_FR;
    player.dashCooldown = FEEL.DASH_CD;
    sfx('dash');
  }
  dashWasUp = !goD;
  if (player.dashCooldown>0) player.dashCooldown--;

  // ── Coyote time + jump buffer bookkeeping ──
  if (player.onGround) player.coyote = FEEL.COYOTE;
  else if (player.coyote>0) player.coyote--;

  const jumpPressed = goJ && jumpWasUp;
  if (jumpPressed) player.jumpBuf = FEEL.BUFFER;
  else if (player.jumpBuf>0) player.jumpBuf--;

  // ── Execute jump ──
  if (player.jumpBuf>0 && player.coyote>0) {
    player.vy = -jumpH;
    player.jumping = true;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuf = 0;
    sfx('jump');
  } else if (jumpPressed && !player.onGround && player.coyote<=0
             && powers.includes('double_jump') && player.extraJumps>0) {
    player.vy = -jumpH*0.85;
    player.extraJumps--;
    player.jumping = true;
    sfx('jump');
  }
  jumpWasUp = !goJ;

  // ── Variable jump height: release early = shorter hop ──
  if (player.jumping && !goJ && player.vy < 0) {
    player.vy *= FEEL.CUT;
    player.jumping = false;
  }
  if (player.vy >= 0) player.jumping = false;

  // ── Glide ──
  if (powers.includes('glide') && goJ && !player.onGround && player.vy>0)
    player.vy = Math.min(player.vy, 2.2);

  player.vy = Math.min(player.vy+GRAVITY, 20);
  player.x += player.vx;
  player.y += player.vy;

  if (player.x<0) player.x=0;
  if (player.x>LEVEL_W-player.w) player.x=LEVEL_W-player.w;

  player.onGround = false;
  platforms.forEach(p => {
    const prevBot = player.y+player.h-player.vy;
    const curBot  = player.y+player.h;
    const inX = player.x+player.w > p.x+4 && player.x < p.x+p.w-4;
    if (inX && prevBot<=p.y && curBot>=p.y && player.vy>=0) {
      player.y = p.y-player.h; player.vy=0; player.onGround=true;
      if (powers.includes('double_jump')) player.extraJumps=1;
    }
  });

  // Remember the last safe ground spot; respawn if you fall in a gap (no penalty)
  if (player.onGround) { player.safeX = player.x; player.safeY = player.y; }
  if (player.y > H + 140) {
    player.x = player.safeX; player.y = player.safeY - 4;
    player.vx = player.vy = 0;
    sfx('land');
  }

  collectibles.forEach(col => {
    if (col.collectedNow || isCollected(CHARACTERS[charIdx].id, activeLvl.id, col.id)) return;
    if (Math.hypot(player.x+player.w/2-col.x, player.y+player.h/2-col.worldY) < 52) triggerCard(col);
  });

  if (player.x+player.w >= postcardX-6) triggerPostcard();

  camX = Math.max(0, Math.min(player.x-W*0.3, LEVEL_W-W));
  player.animTimer++;
  if (player.animTimer>7) { player.animTimer=0; player.animFrame=(player.animFrame+1)%4; }
  if (hudPulse>1) hudPulse -= (hudPulse-1)*0.12;
}

// ═══════════════════════════════════════════════════════
//  LEVEL RENDER
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  LEVEL ART LOADER (paintings drop into assets/levels/<id>/)
// ═══════════════════════════════════════════════════════
const ART_NAMES = ['sky','far','mid','near','foreground','ground','plat-log','plat-rock','plat-plank'];
const levelArt = {};   // id -> { name: Image }
let currentArt = null;

function loadLevelArt(id) {
  if (levelArt[id]) return levelArt[id];
  const set = {};
  ART_NAMES.forEach(n => {
    const img = new Image();
    img._ok = false;
    img.onload  = () => { img._ok = true; };
    img.onerror = () => { img._ok = false; };
    img.src = `assets/levels/${id}/${n}.png`;
    set[n] = img;
  });
  levelArt[id] = set;
  return set;
}
function artOk(name) { return currentArt && currentArt[name] && currentArt[name]._ok; }

// Draw a wide painting as a parallax layer: scale to canvas height, tile across.
function drawArtLayer(name, speed, blend) {
  if (!artOk(name)) return false;
  const img = currentArt[name];
  const scale = H / img.height;
  const tileW = img.width * scale;
  let off = -((camX*speed) % tileW);
  if (off > 0) off -= tileW;
  if (blend) ctx.globalCompositeOperation = blend;  // e.g. 'multiply' for silhouettes on white
  for (let x = off; x < W; x += tileW) {
    ctx.drawImage(img, x, 0, tileW, H);
  }
  if (blend) ctx.globalCompositeOperation = 'source-over';
  return true;
}

// ── Character sprite loader (assets/characters/<id>/<state>-N.png) ──
const CHAR_FRAMES = {
  idle: ['idle-1','idle-2','idle-3','idle-4'],
  run:  ['run-1','run-2','run-3','run-4','run-5','run-6'],
  jump: ['jump-up','jump-down'],
};
const charArt = {};
function loadCharArt(id) {
  if (charArt[id]) return charArt[id];
  const set = { idle:[], run:[], jump:[] };
  for (const st in CHAR_FRAMES) {
    CHAR_FRAMES[st].forEach(n => {
      const img = new Image(); img._ok = false;
      img.onload = () => { img._ok = true; };
      img.onerror = () => {};
      img.src = `assets/characters/${id}/${n}.png`;
      set[st].push(img);
    });
  }
  charArt[id] = set; return set;
}
function okFrames(arr) { return arr.filter(i => i && i._ok); }

// Returns true if it drew a sprite frame (context already mirrored for facing).
function drawCharSprite(char, sx, sy, w, h) {
  const ca = charArt[char.id]; if (!ca) return false;
  const moving = Math.abs(player.vx) > 0.4;
  let frames = null;
  if (!player.onGround) {
    const j = okFrames(ca.jump);
    if (j.length) frames = [ j[player.vy < 0 ? 0 : Math.min(1, j.length-1)] ];
  }
  if (!frames && moving && player.onGround) { const r = okFrames(ca.run); if (r.length) frames = r; }
  if (!frames) { const idle = okFrames(ca.idle); if (idle.length) frames = idle; }
  if (!frames) { const r = okFrames(ca.run); if (r.length) frames = r; }
  if (!frames || !frames.length) return false;
  const rate = moving ? 10 : 1.2;
  const img = frames[Math.floor(levelTime*rate) % frames.length];
  if (!img || !img._ok) return false;
  const drawH = h * 1.85;
  const drawW = drawH * (img.width / img.height);
  const cx = sx + w/2, feet = sy + h;
  ctx.drawImage(img, cx - drawW/2, feet - drawH, drawW, drawH);
  return true;
}

function drawLevel() {
  if (!activeLvl) return;
  const T = THEMES[activeLvl.theme] || THEMES.forest;
  const hasArt = artOk('sky') || artOk('far') || artOk('mid');

  if (hasArt) {
    // ── Painted layer stack ──
    if (!drawArtLayer('sky', 0.05)) {        // sky fallback gradient
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,T.skyTop); g.addColorStop(0.5,T.skyBot); g.addColorStop(0.8,T.horizon); g.addColorStop(1,T.groundTop);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    drawGodRays();
    drawArtLayer('far', 0.10);
    drawAmbientLife(T);
    drawArtLayer('mid', 0.24);
    drawArtLayer('near', 0.55);
  } else {
    // ── Code-drawn fallback (no art yet) ──
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0, T.skyTop); sky.addColorStop(0.5, T.skyBot);
    sky.addColorStop(0.8, T.horizon); sky.addColorStop(1, T.groundTop);
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    drawGodRays();
    drawLandmark(T);
    drawSilhouetteRange(T.far, 0.10, 150, 90, 6);
    ctx.fillStyle='rgba(245,239,224,0.08)';
    for (let i=0;i<6;i++) { const cx=(i*230-(camX*0.14)%230+230)%(W+230)-115; drawCloud(cx, 60+(i%3)*26, 60+(i%2)*22); }
    drawSilhouetteRange(T.mid, 0.24, 200, 130, 5);
    drawAmbientLife(T);
    ctx.fillStyle = adjustColor(T.mid, -10);
    for (let i=0;i<26;i++) { const tx=(i*92-(camX*0.4)%92+92)%(W+92)-46; drawTreeSilhouette(tx, GROUND_Y+6, 26+(i%3)*8); }
    ctx.fillStyle = T.near;
    for (let i=0;i<20;i++) { const tx=(i*128-(camX*0.55)%128+128)%(W+128)-64; drawTreeSilhouette(tx, GROUND_Y+10, 40+hash(i*5)*22); }
    const fog = ctx.createLinearGradient(0, GROUND_Y-140, 0, GROUND_Y+10);
    fog.addColorStop(0,'rgba(0,0,0,0)'); fog.addColorStop(1, hexA(T.fog, 0.35));
    ctx.fillStyle=fog; ctx.fillRect(0, GROUND_Y-140, W, 150);
  }

  // ── Layer 3: Platforms (play layer) ──
  platforms.forEach(p => drawPlatform(p,T));

  // Collectibles
  collectibles.forEach(col => {
    const sx = col.x-camX;
    const bob = Math.sin(levelTime*Math.PI+col.bobOffset)*4;
    const sy  = col.worldY-30+bob;
    const done = col.collectedNow || isCollected(CHARACTERS[charIdx].id, activeLvl.id, col.id);
    if (sx < -60 || sx > W+60) return;

    if (done) {
      ctx.globalAlpha=0.2;
      ctx.font='28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(col.emoji, sx, sy);
      ctx.globalAlpha=1;
    } else {
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,32);
      g.addColorStop(0,'rgba(212,135,74,0.3)'); g.addColorStop(1,'rgba(212,135,74,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,32,0,Math.PI*2); ctx.fill();
      ctx.shadowColor=C.amber; ctx.shadowBlur=10;
      ctx.font='36px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(col.emoji, sx, sy);
      ctx.shadowBlur=0;
      if (col.rare) {
        ctx.beginPath(); ctx.arc(sx+14,sy-16,5,0,Math.PI*2);
        ctx.fillStyle=C.red; ctx.fill();
        ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.stroke();
      }
    }
  });

  drawPostcardMarker();
  drawPlayer();

  // ── Cave / dark ranges (under the foreground so foliage stays dark) ──
  drawCaveDark();

  // ── Layer 4: Foreground occluders (parallax 1.25) — the Ori depth trick ──
  // 'multiply' lets silhouette art on a WHITE background drop its white for free.
  if (!drawArtLayer('foreground', 1.25, 'multiply')) drawForeground(T);
  // ── Layer 5: Atmosphere ──
  drawParticles(T);
  drawVignette();
  // Per-country signature-hue light overlay (ties the scene together)
  if (T.tint) { ctx.fillStyle = T.tint; ctx.fillRect(0,0,W,H); }

  drawStoryCaption();
  drawHUD();
  if (isMobile) drawTouchControls();
}

function drawPlatform(p,T) {
  const sx=p.x-camX, sw=p.w;
  if (sx+sw<-10||sx>W+10) return;

  if (p.isGround) {
    // Draw only within THIS segment's screen span, so gaps read as chasms.
    const x0=Math.max(sx,0), x1=Math.min(sx+sw,W);
    if (x1<=x0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, p.y-24, x1-x0, H-(p.y-24)); ctx.clip();
    ctx.fillStyle=T.groundBot; ctx.fillRect(x0, p.y+40, x1-x0, H);
    if (artOk('ground')) {
      const img=currentArt['ground'];
      const gh=H - p.y + 60;
      const gw=gh*(img.width/img.height);
      // tile aligned to this segment's left edge
      let start = sx - (((sx % gw)+gw)%gw);
      for(let x=start; x<x1; x+=gw) ctx.drawImage(img, x, p.y-12, gw, gh);
    } else {
      ctx.fillStyle=T.groundTop; ctx.fillRect(x0,p.y,x1-x0,p.h);
      ctx.fillStyle=T.grassLine; ctx.fillRect(x0,p.y,x1-x0,8);
    }
    ctx.restore();
    return;
  }

  // Floating platform — painted piece if available
  const kindMap={log:'plat-log',rock:'plat-rock',plank:'plat-plank'};
  const artName=kindMap[p.art];
  if (artName && artOk(artName)) {
    const img=currentArt[artName];
    const dh=sw*(img.height/img.width);
    // Art's flat walkable top is ~25% down from the top edge → align to p.y
    ctx.drawImage(img, sx, p.y - dh*0.25, sw, dh);
    return;
  }

  // Vector fallback
  ctx.fillStyle=T.platFill;
  roundRect(ctx,sx,p.y,sw,p.h,3); ctx.fill();
  ctx.strokeStyle=T.platEdge; ctx.lineWidth=1; ctx.globalAlpha=0.3;
  for(let i=1;i<4;i++){const lx=sx+sw*i/4;ctx.beginPath();ctx.moveTo(lx,p.y+2);ctx.lineTo(lx,p.y+p.h-2);ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(245,239,224,0.15)'; ctx.fillRect(sx+4,p.y+2,sw-8,3);
  ctx.strokeStyle=T.platEdge; ctx.lineWidth=1.5;
  roundRect(ctx,sx,p.y,sw,p.h,3); ctx.stroke();
}

function drawMountain(x,y,w,h) {
  ctx.beginPath(); ctx.moveTo(x-w*.5,y+h); ctx.lineTo(x,y); ctx.lineTo(x+w*.5,y+h); ctx.closePath(); ctx.fill();
}
function drawCloud(x,y,r) {
  ctx.beginPath();
  ctx.arc(x,y,r*.55,0,Math.PI*2); ctx.arc(x+r*.45,y-r*.15,r*.38,0,Math.PI*2); ctx.arc(x-r*.38,y+r*.08,r*.32,0,Math.PI*2);
  ctx.fill();
}
function drawTree(x,y,T,theme) {
  ctx.fillStyle=adjustColor(T.groundTop,-15); ctx.fillRect(x-3,y-30,6,30);
  ctx.fillStyle=theme==='coastal'?C.carto:T.grassLine;
  ctx.beginPath();ctx.arc(x,y-40,18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x-11,y-30,12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+11,y-30,12,0,Math.PI*2);ctx.fill();
}

// ── hex → rgba with alpha ──
function hexA(hex, a) {
  if (hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
// Deterministic pseudo-random from integer (no shimmer)
function hash(i) { const s = Math.sin(i*127.1+levelSeed*311.7)*43758.5; return s - Math.floor(s); }

// ── God rays: soft diagonal light shafts from the sky ──
function drawGodRays() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const sway = Math.sin(levelTime*0.2)*30;
  for (let i=0;i<4;i++) {
    const x = 120 + i*220 + sway;
    const g = ctx.createLinearGradient(x, 0, x-90, H*0.7);
    g.addColorStop(0, hexA(C.amber, 0.10));
    g.addColorStop(1, hexA(C.amber, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x+70, 0);
    ctx.lineTo(x-50, H*0.7); ctx.lineTo(x-120, H*0.7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ── Distant landmark (the place you walk toward) ──
function drawLandmark(T) {
  const sx = W*0.52 - camX*0.06;
  const baseY = GROUND_Y - 40;
  ctx.save();
  if (T.landmark === 'fuji' || T.landmark === 'volcano') {
    // Symmetric cone
    const w=300, h=230;
    ctx.fillStyle = adjustColor(T.far, 6);
    ctx.beginPath();
    ctx.moveTo(sx-w/2, baseY); ctx.lineTo(sx, baseY-h); ctx.lineTo(sx+w/2, baseY);
    ctx.closePath(); ctx.fill();
    // Snow / crater cap
    ctx.fillStyle = T.landmark==='fuji' ? hexA(C.spec,0.85) : hexA(C.red,0.7);
    ctx.beginPath();
    ctx.moveTo(sx-46, baseY-h+58); ctx.lineTo(sx, baseY-h);
    ctx.lineTo(sx+46, baseY-h+58);
    ctx.lineTo(sx+24, baseY-h+44); ctx.lineTo(sx+10, baseY-h+60);
    ctx.lineTo(sx-12, baseY-h+44); ctx.lineTo(sx-28, baseY-h+62);
    ctx.closePath(); ctx.fill();
  } else {
    // Jagged mountain massif (Triglav-style)
    const w=360, h=250;
    ctx.fillStyle = adjustColor(T.far, 6);
    ctx.beginPath();
    ctx.moveTo(sx-w/2, baseY);
    ctx.lineTo(sx-110, baseY-h*0.55);
    ctx.lineTo(sx-50,  baseY-h*0.8);
    ctx.lineTo(sx-10,  baseY-h);
    ctx.lineTo(sx+40,  baseY-h*0.7);
    ctx.lineTo(sx+95,  baseY-h*0.85);
    ctx.lineTo(sx+w/2, baseY);
    ctx.closePath(); ctx.fill();
    // Snow caps
    ctx.fillStyle = hexA(C.spec, 0.8);
    ctx.beginPath();
    ctx.moveTo(sx-10, baseY-h); ctx.lineTo(sx-30, baseY-h*0.82);
    ctx.lineTo(sx+2, baseY-h*0.88); ctx.lineTo(sx+18, baseY-h*0.8);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ── A range of rounded silhouette peaks ──
function drawSilhouetteRange(color, parallax, spacing, baseH, count) {
  ctx.fillStyle = color;
  const off = camX*parallax;
  ctx.beginPath();
  ctx.moveTo(-50, GROUND_Y+10);
  for (let i=-1;i<=count+1;i++) {
    const cx = (i*spacing - off%spacing);
    const h  = baseH + hash(i)*baseH*0.6;
    ctx.lineTo(cx, GROUND_Y - h*0.5);
    ctx.quadraticCurveTo(cx + spacing*0.25, GROUND_Y - h, cx + spacing*0.5, GROUND_Y - h*0.55);
    ctx.quadraticCurveTo(cx + spacing*0.75, GROUND_Y - h*0.2, cx + spacing, GROUND_Y - h*0.5);
  }
  ctx.lineTo(W+50, GROUND_Y+10);
  ctx.closePath(); ctx.fill();
}

function drawTreeSilhouette(x, baseY, h) {
  ctx.beginPath();
  ctx.moveTo(x-h*0.5, baseY);
  ctx.quadraticCurveTo(x-h*0.3, baseY-h*0.6, x, baseY-h);
  ctx.quadraticCurveTo(x+h*0.3, baseY-h*0.6, x+h*0.5, baseY);
  ctx.closePath(); ctx.fill();
}

// ── Ambient background life — the "look at that!" moments ──
function drawAmbientLife(T) {
  if (T.life === 'bear') {
    // A bear slowly ambling along the far treeline
    const span = LEVEL_W - 600;
    const t = (Math.sin(levelTime*0.05)*0.5+0.5);     // 0..1 patrol
    const dir = Math.cos(levelTime*0.05) >= 0 ? 1 : -1;
    const bx = 300 + t*span - camX*0.4;
    const by = GROUND_Y - 26;
    if (bx > -80 && bx < W+80) {
      ctx.save();
      ctx.fillStyle = adjustColor(T.mid, -22);
      ctx.translate(bx, by);
      ctx.scale(dir, 1);
      const bob = Math.sin(levelTime*4)*1.2;
      // body
      ctx.beginPath(); ctx.ellipse(0, bob, 26, 15, 0, 0, Math.PI*2); ctx.fill();
      // head
      ctx.beginPath(); ctx.ellipse(22, -6+bob, 11, 9, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(26, -14+bob, 3, 0, Math.PI*2); ctx.fill(); // ear
      // legs (slow walk)
      const sw = Math.sin(levelTime*4)*3;
      [-14,-2,10,20].forEach((lx,i)=>{
        const off = (i%2?sw:-sw);
        ctx.fillRect(lx, 8, 6, 12+off);
      });
      ctx.restore();
    }
  } else if (T.life === 'bird') {
    // A few birds gliding across the sky
    ctx.strokeStyle = adjustColor(T.far, -20);
    ctx.lineWidth = 2.5;
    for (let i=0;i<3;i++) {
      const speed = 14 + i*5;
      const bx = ((levelTime*speed + i*340) % (LEVEL_W*0.5+300)) - 150 - camX*0.2;
      const by = 70 + i*34 + Math.sin(levelTime*0.8 + i)*10;
      const sx = ((bx % (W+200)) + (W+200)) % (W+200) - 100;
      const flap = Math.sin(levelTime*5 + i)*5;
      ctx.beginPath();
      ctx.moveTo(sx-9, by);
      ctx.quadraticCurveTo(sx-4, by-6-flap, sx, by);
      ctx.quadraticCurveTo(sx+4, by-6-flap, sx+9, by);
      ctx.stroke();
    }
  }
}

// ── Foreground occluders (fast parallax, out-of-focus dark foliage) ──
function drawForeground(T) {
  ctx.fillStyle = T.fore;
  // Bottom grass/foliage clumps the player passes in front of
  for (let i=0;i<16;i++) {
    const wx = i*150;
    const sx = wx - camX*1.25;
    if (sx < -90 || sx > W+90) continue;
    const clump = 40 + hash(i*3)*40;
    // soft blob
    ctx.beginPath();
    ctx.ellipse(sx, H+10, clump, clump*0.7, 0, 0, Math.PI*2);
    ctx.fill();
    // a few blades
    for (let b=0;b<4;b++){
      const bx = sx - clump*0.5 + b*clump*0.33;
      ctx.beginPath();
      ctx.moveTo(bx, H);
      ctx.quadraticCurveTo(bx+ (hash(i*7+b)-0.5)*16, H-30-hash(i+b)*22, bx+(hash(i+b)-0.5)*24, H-40-hash(i*2+b)*26);
      ctx.lineWidth = 4; ctx.strokeStyle = T.fore; ctx.stroke();
    }
  }
}

// ── Atmosphere particles (fireflies / petals / dust) ──
function drawParticles(T) {
  ctx.save();
  particles.forEach(p => {
    const sx = p.x - camX*1.1;
    if (sx < -20 || sx > W+20) return;
    const sy = p.y + Math.sin(levelTime*p.drift + p.phase)*p.sway;
    if (T.particleKind === 'firefly') {
      const pulse = 0.35 + 0.35*Math.sin(levelTime*2 + p.phase);
      ctx.shadowColor = T.particle; ctx.shadowBlur = 8;
      ctx.fillStyle = hexA(T.particle, pulse);
      ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    } else if (T.particleKind === 'petal') {
      const fall = (levelTime*16*p.drift) % (H+40);
      const py = (p.y + fall) % (H+40);
      ctx.fillStyle = hexA(T.particle, 0.5);
      ctx.save(); ctx.translate(sx, py); ctx.rotate(levelTime*p.drift + p.phase);
      roundRect(ctx, -p.r, -p.r*0.6, p.r*2, p.r*1.2, 1.5); ctx.fill();
      ctx.restore();
    } else { // dust
      ctx.fillStyle = hexA(T.particle, 0.18);
      ctx.beginPath(); ctx.arc(sx, sy, p.r*0.8, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
}

// ── Vignette + warm focal grade ──
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H*0.45, H*0.25, W/2, H*0.5, H*0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(15,22,34,0.45)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
}
function drawPostcardMarker() {
  const sx=postcardX-camX;
  if (sx<-60||sx>W+60) return;
  const bob=Math.sin(levelTime*1.8)*4;
  ctx.fillStyle=C.ink; ctx.fillRect(sx-3,GROUND_Y-70,6,70);
  ctx.fillStyle=C.spec; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  roundRect(ctx,sx-22,GROUND_Y-72+bob,44,32,4); ctx.fill(); ctx.stroke();
  ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('📬',sx,GROUND_Y-58+bob);
  ctx.font="700 11px 'Playfair Display',serif"; ctx.fillStyle=C.amber;
  ctx.textBaseline='bottom'; ctx.fillText('FINISH',sx,GROUND_Y-76+bob);
}

function drawPlayer() {
  const char=CHARACTERS[charIdx];
  const sx=player.x-camX, sy=player.y, w=player.w, h=player.h;
  const powers=getPowers(char.id);
  ctx.save();
  if (player.facing===-1) { ctx.translate(sx+w/2,0); ctx.scale(-1,1); ctx.translate(-(sx+w/2),0); }

  // Shadow
  ctx.fillStyle='rgba(27,42,59,0.22)';
  ctx.beginPath(); ctx.ellipse(sx+w/2,GROUND_Y+4,w*.45,5,0,0,Math.PI*2); ctx.fill();

  // Dash trail
  if (player.dashTimer>0) {
    ctx.globalAlpha=player.dashTimer/FEEL.DASH_FR*.32;
    ctx.fillStyle=C.amber;
    roundRect(ctx,sx-player.facing*12+4,sy+h*.3,w-8,h*.55,4); ctx.fill();
    ctx.globalAlpha=1;
  }

  // Painted sprite if available, else vector fallback
  if (!drawCharSprite(char, sx, sy, w, h)) {
    // Body
    ctx.fillStyle=char.bodyColor;
    roundRect(ctx,sx+4,sy+h*.38,w-8,h*.58,4); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.stroke();
    // Legs
    ctx.fillStyle=adjustColor(C.ink,20);
    roundRect(ctx,sx+5,sy+h*.84,10,h*.18,3); ctx.fill();
    roundRect(ctx,sx+w-15,sy+h*.84,10,h*.18,3); ctx.fill();
    // Head
    ctx.fillStyle='#E8B98A';
    ctx.beginPath(); ctx.ellipse(sx+w/2,sy+h*.26,13,13,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.stroke();
    // Hat
    ctx.fillStyle=char.hatColor;
    roundRect(ctx,sx+w/2-13,sy+h*.13,26,10,3); ctx.fill();
    ctx.fillRect(sx+w/2-8,sy+h*.04,16,11);
    ctx.strokeStyle=C.ink; ctx.lineWidth=1;
    roundRect(ctx,sx+w/2-13,sy+h*.13,26,10,3); ctx.stroke();
    // Eye
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.arc(sx+w/2+5,sy+h*.25,2.5,0,Math.PI*2); ctx.fill();
    // Glide arms
    if (powers.includes('glide') && !player.onGround && player.vy>0 && (keys['ArrowUp']||keys[' ']||touch.jump)) {
      ctx.strokeStyle=char.bodyColor; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(sx+4,sy+h*.5); ctx.lineTo(sx-14,sy+h*.38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx+w-4,sy+h*.5); ctx.lineTo(sx+w+14,sy+h*.38); ctx.stroke();
    }
  }
  ctx.restore();
}

// Darken the view inside cave ranges; a soft light follows the player so the
// collectible glow matters. Intensity scales with how much of the view is dark.
function drawCaveDark() {
  if (!activeDark.length) return;
  const viewL = camX, viewR = camX + W;
  let cover = 0;
  activeDark.forEach(([s,e]) => {
    const o = Math.max(0, Math.min(viewR,e) - Math.max(viewL,s));
    cover = Math.max(cover, o / W);
  });
  if (cover <= 0.01) return;
  const a = cover * 0.78;
  // Base darkness
  ctx.fillStyle = `rgba(8,12,20,${a})`;
  ctx.fillRect(0,0,W,H);
  // A pool of light around the player (punched back out)
  const px = player.x - camX + player.w/2, py = player.y + player.h/2;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  const r = ctx.createRadialGradient(px,py,20, px,py,200);
  r.addColorStop(0, `rgba(0,0,0,${a})`); r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r; ctx.beginPath(); ctx.arc(px,py,200,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// Story-marker captions — fade in as the player passes each beat. Your voice.
function drawStoryCaption() {
  if (!activeStory.length) return;
  let best=null, bestD=1e9;
  activeStory.forEach(b => { const d=Math.abs(player.x - b.x); if (d<bestD){bestD=d;best=b;} });
  if (!best || bestD > 300) return;
  const alpha = Math.min(1, (300 - bestD)/120);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "400 17px 'Baloo 2', sans-serif";
  ctx.textAlign='left'; ctx.textBaseline='top';
  // word-wrap to ~ 560px
  const words = best.text.split(' ');
  const maxW = 560; let line='', lines=[];
  words.forEach(w => {
    const t = line ? line+' '+w : w;
    if (ctx.measureText(t).width > maxW) { lines.push(line); line=w; } else line=t;
  });
  if (line) lines.push(line);
  const padX=22, padY=14, lh=24;
  const boxW = Math.min(maxW, Math.max(...lines.map(l=>ctx.measureText(l).width))) + padX*2;
  const boxH = lines.length*lh + padY*2 - 6;
  const bx = W/2 - boxW/2, by = 64;
  // Panel
  ctx.fillStyle = C.ink85;
  roundRect(ctx, bx, by, boxW, boxH, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(212,135,74,0.5)'; ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, boxW, boxH, 8); ctx.stroke();
  // Text (italic-feel via Specimen color)
  ctx.fillStyle = C.spec;
  lines.forEach((l,i) => ctx.fillText(l, bx+padX, by+padY+i*lh));
  ctx.restore();
}

function drawHUD() {
  const char=CHARACTERS[charIdx], charId=char.id;
  const items=activeLvl.collectibles.filter(c=>c.forAge==='both'||c.forAge===String(char.age));

  const powers=getPowers(charId);

  // Collected panel
  ctx.fillStyle=C.ink85;
  roundRect(ctx,10,10,200,52,6); ctx.fill();
  ctx.save();
  const s=hudPulse;
  ctx.translate(110,36); ctx.scale(s,s); ctx.translate(-110,-36);
  ctx.font="600 14px 'Baloo 2',sans-serif"; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=C.amber; ctx.fillText(`🔬 ${got} / ${items.length} specimens`,18,28);
  ctx.restore();
  items.forEach((col,i)=>{
    const done=col.collectedNow||isCollected(charId,activeLvl.id,col.id);
    ctx.beginPath(); ctx.arc(20+i*16,52,5,0,Math.PI*2);
    ctx.fillStyle=done?(col.rare?C.red:C.bot):'rgba(245,239,224,0.2)';
    ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.stroke();
  });

  // Power badges
  if (powers.length>0) {
    const pw=powers.length*36+14;
    ctx.fillStyle=C.ink85;
    roundRect(ctx,W-pw-10,10,pw,40,6); ctx.fill();
    powers.forEach((pid,i)=>{
      const pd=allPowerDefs().find(p=>p.id===pid);

      ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pd.emoji, W-pw+10+i*36+12, 30);

  }

  // Country name
  ctx.fillStyle=C.ink85;
  roundRect(ctx,W/2-84,10,168,34,6); ctx.fill();
  ctx.font="700 13px 'Playfair Display',serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=C.spec;
  ctx.fillText(activeLvl.name.toUpperCase(), W/2, 27);

  // Journal tap area (visible on canvas)
  ctx.fillStyle=C.ink85;
  roundRect(ctx, ZONES.journal.x, ZONES.journal.y, ZONES.journal.w, ZONES.journal.h, 6); ctx.fill();
  ctx.strokeStyle='rgba(245,239,224,0.25)'; ctx.lineWidth=1; ctx.stroke();
  ctx.font="600 12px 'Baloo 2',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=C.spec;
  ctx.fillText('📖  Journal', ZONES.journal.x+ZONES.journal.w/2, ZONES.journal.y+ZONES.journal.h/2);
  drawMuteBtn();
}

function drawMuteBtn() {

function drawTouchControls() {

function drawCtrlBtn(z, label, pressed, large) {
  ctx.fillStyle = pressed ? 'rgba(245,239,224,0.22)' : 'rgba(245,239,224,0.08)';
  ctx.strokeStyle = pressed ? C.amber : 'rgba(245,239,224,0.28)';
  ctx.lineWidth = pressed ? 2 : 1.5;
  roundRect(ctx, z.x, z.y, z.w, z.h, 6);
  ctx.fill(); ctx.stroke();
  ctx.font = `${large?34:26}px 'Baloo 2',sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = pressed ? C.amber : 'rgba(245,239,224,0.65)';
  ctx.fillText(label, z.x+z.w/2, z.y+z.h/2);
}

// ═══════════════════════════════════════════════════════
//  AUDIO (synthesized — no asset files)
// ═══════════════════════════════════════════════════════
let audioCtx = null;
let muted = (localStorage.getItem('we_muted') === '1');
let ambientNodes = null;

function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { audioCtx = null; }
}

function tone(freq, dur, type='sine', vol=0.12, when=0) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function sfx(kind) {
  if (!audioCtx || muted) return;
  switch(kind) {
    case 'jump':    tone(440, 0.16, 'sine', 0.08); break;
    case 'collect': // warm rising arpeggio
      tone(523,0.18,'sine',0.1,0); tone(659,0.18,'sine',0.1,0.08); tone(784,0.3,'sine',0.1,0.16); break;
    case 'power':   // bright fanfare
      tone(523,0.2,'triangle',0.1,0); tone(784,0.2,'triangle',0.1,0.1); tone(1047,0.4,'triangle',0.1,0.2); break;
    case 'stamp':   tone(160, 0.18, 'square', 0.09); tone(110,0.22,'sine',0.07,0.02); break;
    case 'dash':    tone(660, 0.12, 'sawtooth', 0.05); break;
    case 'land':    tone(220, 0.08, 'sine', 0.04); break;
  }
}

// Gentle ambient pad — soft chord per theme, very low volume
const AMBIENT_CHORDS = {
  forest:  [196.00, 246.94, 293.66],  // G major-ish, calm
  coastal: [220.00, 277.18, 329.63],  // A major, airy
  tropical:[174.61, 220.00, 261.63],  // F major, warm
};
function startAmbient(theme) {
  stopAmbient();
  if (!audioCtx || muted) return;
  const chord = AMBIENT_CHORDS[theme] || AMBIENT_CHORDS.forest;
  const master = audioCtx.createGain();
  master.gain.value = 0.0;
  master.gain.setTargetAtTime(0.05, audioCtx.currentTime, 1.5);
  master.connect(audioCtx.destination);
  const oscs = chord.map(f => {
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = audioCtx.createGain(); g.gain.value = 0.5;
    o.connect(g); g.connect(master); o.start();
    return o;
  });
  ambientNodes = { master, oscs };
}
function stopAmbient() {
  if (!ambientNodes) return;
  const { master, oscs } = ambientNodes;
  try {
    master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4);
    oscs.forEach(o => o.stop(audioCtx.currentTime + 1.2));
  } catch(e) {}
  ambientNodes = null;
}
function toggleMute() {
  muted = !muted;
  localStorage.setItem('we_muted', muted ? '1' : '0');
  if (muted) stopAmbient();
  else if (appState === 'level' && activeLvl) startAmbient(activeLvl.theme);
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function show(id) { const e=document.getElementById(id); e.classList.remove('hidden'); e.classList.add('active'); }
function hide(id) { const e=document.getElementById(id); e.classList.add('hidden'); e.classList.remove('active'); }
function inZone(x,y,z) { return x>=z.x && x<=z.x+z.w && y>=z.y && y<=z.y+z.h; }
function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function adjustColor(hex,amt) {
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.min(255,Math.max(0,(n>>16)+amt));
  const g=Math.min(255,Math.max(0,((n>>8)&0xFF)+amt));
  const b=Math.min(255,Math.max(0,(n&0xFF)+amt));
  return `rgb(${r},${g},${b})`;
}

// ═══════════════════════════════════════════════════════
//  TOUCH INPUT (multi-touch, normalized to canvas coords)
// ═══════════════════════════════════════════════════════
function canvasCoords(e) {
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}

function syncTouchState() {
  touch.left=touch.right=touch.jump=touch.dash=false;
  activeTouches.forEach(({x,y})=>{
    if (inZone(x,y,ZONES.left))  touch.left =true;
    if (inZone(x,y,ZONES.right)) touch.right=true;
    if (inZone(x,y,ZONES.jump))  touch.jump =true;
    if (inZone(x,y,ZONES.dash))  touch.dash =true;
  });
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const p=canvasCoords({clientX:t.clientX,clientY:t.clientY});
    activeTouches.set(t.identifier, p);
    // One-shot taps
    if (inZone(p.x,p.y,ZONES.mute) && (appState==='level'||appState==='map')) { toggleMute(); return; }
    if (inZone(p.x,p.y,ZONES.journal) && (appState==='level'||appState==='map')) { openJournal(); return; }
    if (appState==='map') mapClick(p.x,p.y);
  });
  syncTouchState();
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const p=canvasCoords({clientX:t.clientX,clientY:t.clientY});
    activeTouches.set(t.identifier,p);
  });
  syncTouchState();
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>activeTouches.delete(t.identifier));
  syncTouchState();
},{passive:false});

// Desktop mouse (map only)
canvas.addEventListener('click',     e=>{ const p=canvasCoords(e); mapClick(p.x,p.y); });
canvas.addEventListener('mousemove', e=>{ const p=canvasCoords(e); mapMove(p.x,p.y); });

// Keyboard
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if((e.key==='j'||e.key==='J')&&(appState==='level'||appState==='map')) openJournal();
  if(e.key==='m'||e.key==='M') toggleMute();
  if(e.key==='Escape'&&appState==='journal') closeJournal();
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop() {
  ctx.clearRect(0,0,W,H);
  if (appState==='map') { drawMap(); }
  else if (appState==='level'||appState==='popup') { updateLevel(); drawLevel(); }
  else if (appState==='postcard'||appState==='journal') { if(activeLvl)drawLevel();else drawMap(); }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
(async function init() {
  drawLoadingBg();
  try { LEVELS = await loadLevelsFromSupabase(); } catch(e) {}
  buildCharSelect();
  drawLoadingBg();
})();

function drawLoadingBg() {
// Background map behind char select
ctx.fillStyle=C.carto; ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(245,239,224,0.05)'; ctx.lineWidth=1;
for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.fillStyle=C.bot;
[[55,115,165,170],[130,300,75,170],[420,100,100,75],[428,185,110,245],[525,80,290,185],[680,375,140,100]]
  .forEach(([x,y,w,h])=>{ roundRect(ctx,x,y,w,h,20); ctx.fill(); });
}

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
